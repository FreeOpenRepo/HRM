services:
  hrm-db:
    image: postgis/postgis:17-3.5-alpine
    container_name: hrm-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hrm_db
    ports:
      - "5438:5432"
    volumes:
      - hrm_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hrm-network

  hrm-api:
    build:
      context: ./hrm-api
      dockerfile: Dockerfile
    container_name: hrm-api
    ports:
      - "5060:5060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5060
      - ConnectionStrings__PostgresConnection=Host=hrm-db;Port=5432;Database=hrm_db;Username=postgres;Password=postgres
    depends_on:
      hrm-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hrm-network

  hrm-web:
    build:
      context: ./hrm-web
      dockerfile: Dockerfile
    container_name: hrm-web
    ports:
      - "3006:3006"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5060
    depends_on:
      - hrm-api
    restart: unless-stopped
    networks:
      - hrm-network

volumes:
  hrm_postgres_data:

networks:
  hrm-network:
    driver: bridge
